<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card-root">
<div class="label">Buttons · Primary / Modal / Gold CTA</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px">
  <button style="background:#002B7A;color:#fff;border:none;border-radius:9999px;padding:10px 18px;font-family:Inter;font-weight:700;font-size:0.9rem;box-shadow:0 2px 5px rgba(0,43,122,0.2);cursor:pointer"><i class="bi bi-arrow-right"></i> Primario</button>
  <button style="background:#00695c;color:#fff;border:none;border-radius:9999px;padding:10px 20px;font-family:Inter;font-weight:700;font-size:0.9rem;cursor:pointer">Modo Manual <i class="bi bi-arrow-right"></i></button>
  <button style="background:#6a1b9a;color:#fff;border:none;border-radius:9999px;padding:10px 20px;font-family:Inter;font-weight:700;font-size:0.9rem;cursor:pointer">Modo Generar Horarios <i class="bi bi-search"></i></button>
  <button style="background:linear-gradient(135deg,#facc15,#ca8a04);color:#fff;border:1px solid #fef08a;border-radius:9999px;padding:12px 26px;font-family:Inter;font-weight:700;font-size:0.95rem;box-shadow:0 0 15px rgba(250,204,21,0.5);cursor:pointer">COMENZAR <i class="bi bi-arrow-right-short"></i></button>
</div>
<div class="label" style="margin-top:16px">Tool buttons · light / disabled / danger</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
  <button style="background:#f8f9fa;color:#495057;border:none;font-weight:600;font-size:0.85rem;padding:8px 14px;border-radius:10px;cursor:pointer"><i class="bi bi-sort-down"></i> Materia</button>
  <button style="background:#f8f9fa;color:#495057;opacity:0.5;border:none;font-weight:600;font-size:0.85rem;padding:8px 14px;border-radius:10px;cursor:not-allowed"><i class="bi bi-arrow-counterclockwise"></i> Deshacer</button>
  <button style="background:#fff5f5;color:#e03131;border:none;font-weight:600;font-size:0.85rem;padding:8px 14px;border-radius:10px;cursor:pointer"><i class="bi bi-trash"></i> Limpiar</button>
  <button style="background:#198754;color:#fff;border:none;border-radius:9999px;padding:7px 14px;font-family:Inter;font-weight:700;font-size:0.85rem;cursor:pointer"><i class="bi bi-mortarboard"></i> Este es mi horario final</button>
</div>
</div></body></html>
