<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card-root">
<div class="label">Badges / Pills / Chips</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px">
  <span style="background:#D59F0F;color:#002B7A;font-weight:800;padding:6px 12px;border-radius:20px;font-size:0.75rem;text-transform:uppercase;font-family:Inter"><i class="bi bi-mortarboard"></i> Proyecto SADA</span>
  <span style="background:#f8f9fa;color:#212529;border:1px solid #dee2e6;font-weight:700;padding:7px 14px;border-radius:9999px;font-size:0.8rem;font-family:Inter">18 Créditos</span>
  <span style="background:#e7f1ff;color:#002B7A;border-left:4px solid #002B7A;padding:6px 12px;font-size:0.85rem;font-family:Inter;font-weight:700">Materia activa</span>
  <span style="background:#d1e7dd;color:#166534;border-left:4px solid #198754;padding:6px 12px;font-size:0.85rem;font-family:Inter;font-weight:700">Inscrita</span>
  <span style="background:#fff3cd;color:#856404;border-left:4px solid #D59F0F;padding:6px 12px;font-size:0.85rem;font-family:Inter;font-weight:700">Candidata</span>
  <span style="background:#fff5f5;color:#c92a2a;border-left:4px solid #dc3545;padding:6px 12px;font-size:0.85rem;font-family:Inter;font-weight:700">Requerida</span>
</div>
<div class="label" style="margin-top:16px">Visual pill toggle · step badge · toast</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px">
  <span style="background:#212529;color:#fff;border-radius:20px;padding:7px 16px;font-family:Inter;font-weight:800;font-size:0.75rem;letter-spacing:0.5px;text-transform:uppercase"><i class="bi bi-layout-text-window-reverse"></i> Visual</span>
  <span style="display:inline-flex;justify-content:center;align-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:0.85rem;color:#fff;background:#00695c;font-family:Inter">1</span>
  <span style="display:inline-flex;justify-content:center;align-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:0.85rem;color:#fff;background:#6a1b9a;font-family:Inter">2</span>
  <span style="background:#198754;color:#fff;padding:8px 18px;border-radius:30px;font-family:Inter;font-weight:600;font-size:0.85rem"><i class="bi bi-check-circle"></i> Guardado</span>
</div>
</div></body></html>
